name: Auto-Update VPN Subscription

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run VPN Aggregator & Updater
        run: |
          python updater.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.txt sub sub_raw.txt nodes.json clash.yaml sing-box.json
          git diff --staged --quiet || (git commit -m "Auto-update VPN nodes [skip ci]" && git push)
